        <div class="thoughts" style="text-align: center; margin-bottom: 25px;">

        <p>

          透過文化、生活感與季節性主題，為永康街建立一致的視覺氛圍與街區識別。

          街區每個角落都融入主題元素，隨著四季更迭呈現不同色彩與活動，

          讓遊客感受新鮮感與生活氣息，使整條街成為一個有故事、有氛圍、

          易於辨識的主題空間。
